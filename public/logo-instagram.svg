<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <radialGradient id="ig-grad" cx="0.3" cy="1.07" r="1.3" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="#FDF497"/>
      <stop offset="35%" stop-color="#FD5949"/>
      <stop offset="65%" stop-color="#D6249F"/>
      <stop offset="100%" stop-color="#285AEB"/>
    </radialGradient>
  </defs>
  <!-- Gradient rounded-square background -->
  <rect width="24" height="24" rx="6" fill="url(#ig-grad)"/>
  <!-- White rounded-square outline -->
  <rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- White circle outline -->
  <circle cx="12" cy="12" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- White dot (top-right) -->
  <circle cx="17.5" cy="6.5" r="1" fill="#FFFFFF"/>
